# CryptoKit 自动构建与发布工作流
# ---------------------------------------------------------------
# 触发：push 到 main 或手动运行 → 编译 Windows WinUI3 + Go 引擎，
#       把 v1.0.0 标签移动到当前提交，并创建/更新 GitHub Release。
# 产物：CryptoKit-v1.0.0-win-x64.zip（自包含部署，含 CryptoKit.exe、Windows App SDK
#       原生运行时 DLL、resources.pri 与 CryptoKitEngine.exe；解压后整目录复制到任意
#       位置即可运行）。发布前自动冒烟测试，确认主窗口真正出现。
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 构建并发布 (win-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # Go 1.26（go.mod 要求）
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      # .NET 10 SDK（WinUI3 目标框架 net10.0-windows10.0.19041.0，WindowsAppSDK 2.1.3）
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # C# WinUI3 前端（便携自包含，与 winui3/build.ps1 一致；原生 WinUI3 需显式 Platform=x64）
      - name: 编译 C# WinUI3 前端
        run: dotnet publish winui3/CryptoKit/CryptoKit.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o publish

      # Go 密码引擎（纯静态，无 cgo、无运行时依赖）
      - name: 编译 Go 密码引擎
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o publish/CryptoKitEngine.exe ./cmd/engine

      # 冒烟测试：真实启动 CryptoKit.exe，验证标题为「CryptoKit」的主窗口确实出现后才允许
      # 打标签发布。用主窗口标题区分真实窗口与「启动失败」错误对话框（错误框也有窗口句柄，
      # 只查 MainWindowHandle 会造成假阳性）；同时断言未生成 startup-error.log。
      - name: 冒烟测试：验证主窗口能正常出现
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) "publish\CryptoKit.exe"
          $dir = Split-Path $exe
          $log = Join-Path $dir "startup-error.log"
          if (-not (Test-Path $exe)) { throw "未找到 CryptoKit.exe: $exe" }
          if (Test-Path $log) { Remove-Item $log -Force }

          $p = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $ok = $false
          $title = ""
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited) { break }
            if ($p.MainWindowHandle -ne 0 -and $p.MainWindowTitle -eq "CryptoKit") {
              $ok = $true; $title = $p.MainWindowTitle; break
            }
          }

          $cleanup = {
            Get-Process -Name "CryptoKit" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process -Name "CryptoKitEngine" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          if (-not $ok) {
            & $cleanup
            $state = if ($p.HasExited) { "进程提前退出，ExitCode=$($p.ExitCode)" } else { "30 秒内未出现标题为 CryptoKit 的主窗口" }
            if (Test-Path $log) { $state += "；startup-error.log 内容：`n$(Get-Content $log -Raw -ErrorAction SilentlyContinue)" }
            throw "冒烟测试失败：$state"
          }
          Write-Host "冒烟测试通过：主窗口出现，Title='$title'"

          # 主窗口在时，引擎子进程必须已被拉起，否则算法功能会全部失败
          $engine = Get-Process -Name "CryptoKitEngine" -ErrorAction SilentlyContinue
          if (-not $engine) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            & $cleanup
            throw "冒烟测试失败：主窗口出现但 CryptoKitEngine.exe 未运行，算法功能将全部不可用"
          }
          Write-Host "引擎子进程正常：PID=$($engine.Id)"

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          & $cleanup
          if (Test-Path $log) { throw "出现主窗口但存在 startup-error.log：`n$(Get-Content $log -Raw -ErrorAction SilentlyContinue)" }
          Write-Host "已清理测试进程。"

      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path "publish\*" -DestinationPath "CryptoKit-v1.0.0-win-x64.zip" -CompressionLevel Optimal

      # 把 v1.0.0 标签移动到当前提交（--force 幂等覆盖旧标签）。
      # 注意：用 GITHUB_TOKEN 移动的标签不会再次触发本工作流，不会死循环。
      - name: 移动 v1.0.0 标签到当前提交
        run: |
          git tag -f v1.0.0
          git push origin v1.0.0 --force

      # 创建或更新 GitHub Release（若该标签已有 Release 则自动更新附件）
      - name: 发布或更新 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          files: CryptoKit-v1.0.0-win-x64.zip
          body: |
            ## CryptoKit v1.0.0

            🛡️ 密码算法工具箱 · WinUI3 原生版，所有计算在本地完成，**数据不离开本机**。

            ### ✨ 主要功能
            - **对称加密**：AES-128/192/256 全模式、ChaCha20-Poly1305、AES-SIV/GCM-SIV、DES/3DES、RC4、FPE 等
            - **国密算法**：SM2 / SM3 / SM4 / SM9 / ZUC（GM/T 标准）
            - **后量子密码**：ML-KEM、ML-DSA、SLH-DSA、Falcon、HQC（NIST FIPS 203/204/205）
            - **非对称加密**：RSA、ECDSA/ECDH、X25519 / Ed25519 / Ed448 等
            - **哈希 / MAC / KDF**：SHA 全系、BLAKE、HMAC、PBKDF2、HKDF、Argon2、scrypt 等
            - **FPE 格式保留加密**：FF1、FF3-1、FFX
            - **金融密码工具**：PIN Block、CVV、PVV、EMV、Retail MAC
            - **工具箱**：编解码、证书、TLS/TLCP、JWT、文件加解密等

            ### 📦 产物说明
            - `CryptoKit-v1.0.0-win-x64.zip`：Windows 11 版便携包，解压后整目录复制即可运行（免安装、免 WebView2）
            - 关闭后零残留：不产生临时文件、不占用 C 盘缓存
            - 未签名；首次运行如遇 SmartScreen 提示，选择「仍要运行」
